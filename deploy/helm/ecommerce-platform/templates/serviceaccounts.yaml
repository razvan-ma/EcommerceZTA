{{- range $name, $_ := .Values.services }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "ecommerce-platform.labels" $ | nindent 4 }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels:
    app: postgres
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  labels:
    app: keycloak
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-bootstrap
  labels:
    app: db-bootstrap
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.opa.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa
  labels:
    app: opa
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
{{- end }}
