{{- /*
All credentials are generated per deployment and never stored in values.yaml.
Existing values are reused on upgrade (see the "ecommerce-platform.password" helper).
*/ -}}
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ include "ecommerce-platform.password" (dict "ctx" $ "name" "postgres-credentials") | quote }}
{{- range $name, $config := .Values.services }}
{{- if $config.database }}
---
apiVersion: v1
kind: Secret
metadata:
  name: db-{{ $name }}
  labels:
    app: {{ $name }}
    {{- include "ecommerce-platform.labels" $ | nindent 4 }}
type: Opaque
data:
  username: {{ include "ecommerce-platform.dbRole" $name | b64enc | quote }}
  password: {{ include "ecommerce-platform.password" (dict "ctx" $ "name" (printf "db-%s" $name)) | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.keycloak.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  labels:
    app: keycloak
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ include "ecommerce-platform.password" (dict "ctx" $ "name" "keycloak-admin") | quote }}
{{- end }}
