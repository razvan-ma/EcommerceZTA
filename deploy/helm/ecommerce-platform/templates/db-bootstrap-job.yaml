{{- if .Values.postgres.enabled }}
{{- $db := .Values.postgres.database }}
# Data-plane least privilege: one PostgreSQL role and schema per service.
# A service's role owns only its own schema, so a compromised workload that
# can still reach PostgreSQL through the mesh cannot read other services' tables.
# The SQL is idempotent and runs in a single transaction, so roles only become
# usable once their tables have been moved into place.
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-bootstrap
  labels:
    app: db-bootstrap
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
data:
  bootstrap.sql: |
    REVOKE ALL ON DATABASE {{ $db }} FROM PUBLIC;
    REVOKE ALL ON SCHEMA public FROM PUBLIC;
    {{- range $name, $config := .Values.services }}
    {{- if $config.database }}
    {{- $role := include "ecommerce-platform.dbRole" $name }}

    -- {{ $name }}
    SELECT 'CREATE ROLE {{ $role }}'
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ $role }}')\gexec
    ALTER ROLE {{ $role }} WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD :'pw_{{ $name }}';
    ALTER ROLE {{ $role }} SET search_path = {{ $role }};
    GRANT CONNECT ON DATABASE {{ $db }} TO {{ $role }};
    CREATE SCHEMA IF NOT EXISTS {{ $role }} AUTHORIZATION {{ $role }};
    ALTER SCHEMA {{ $role }} OWNER TO {{ $role }};
    REVOKE ALL ON SCHEMA {{ $role }} FROM PUBLIC;
    {{- range $config.database.tables }}
    ALTER TABLE IF EXISTS public.{{ . }} SET SCHEMA {{ $role }};
    ALTER TABLE IF EXISTS {{ $role }}.{{ . }} OWNER TO {{ $role }};
    {{- end }}
    {{- end }}
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap
  labels:
    app: db-bootstrap
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: db-bootstrap
        {{- include "ecommerce-platform.labels" . | nindent 8 }}
      annotations:
        checksum/sql: {{ toJson .Values.services | sha256sum }}
        # The database is only reachable over mesh mTLS, so wait for the sidecar.
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: db-bootstrap
      restartPolicy: Never
      containers:
        - name: db-bootstrap
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: {{ $db | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            {{- range $name, $config := .Values.services }}
            {{- if $config.database }}
            - name: PW_{{ upper $name }}
              valueFrom:
                secretKeyRef:
                  name: db-{{ $name }}
                  key: password
            {{- end }}
            {{- end }}
          command:
            - sh
            - -ec
            - |
              until pg_isready -q; do echo "waiting for postgres"; sleep 2; done
              psql -v ON_ERROR_STOP=1 --single-transaction \
                {{- range $name, $config := .Values.services }}
                {{- if $config.database }}
                -v pw_{{ $name }}="$PW_{{ upper $name }}" \
                {{- end }}
                {{- end }}
                -f /bootstrap/bootstrap.sql
              echo "database roles and schemas are in place"
              # No-op with native sidecars; stops a classic sidecar so the Job completes.
              wget -qO- --post-data='' http://localhost:15020/quitquitquit >/dev/null 2>&1 || true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: sql
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: db-bootstrap
{{- end }}
